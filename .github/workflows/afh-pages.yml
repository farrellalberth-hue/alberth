name: AFH Free GitHub Pages Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afh-pages.yml'
      - 'index.html'
      - 'afh-3d-sections-v31.css'
      - 'afh-3d-sections-v31.js'
      - 'afh-mobile-fix-v28.css'
      - 'afh-galaxy-3d-v29.css'
      - 'afh-galaxy-3d-v29.js'
      - 'afh-galaxy-fallback-v29.js'
      - 'learning-index-v25.json'
      - 'yellow-book/**'
      - 'knowledge-library-v18.css'
      - 'knowledge-library-v18.js'
      - 'afh-v17-noir.css'
      - 'afh-v17-lounge.js'
      - 'atelier-noir-v19.css'
      - 'atelier-noir-v19.js'
      - 'afh-cosmos-v20.css'
      - 'afh-cosmos-v20.js'
      - 'studio-v7.js'
      - 'build-thumbnails.py'
      - 'afh-video-atlas-v21.css'
      - 'afh-audio-dock-v21.js'
      - 'alberth-brand-v24.css'
      - 'alberth-mark.svg'
      - 'atelier-pages-v19.css'
      - 'yellow-book/atelier-v19.css'
      - 'about/**'
      - 'journey/**'
      - 'library/**'
      - 'deploy-static.py'
  schedule:
    - cron: '15 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: afh-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing AFH portfolio
        uses: actions/checkout@v4

      - name: Build no-cost static preview with correct project-path links
        env:
          AFH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, shutil, json
          base = Path.cwd()
          target = base / "_site"
          ignored = {".git", ".github", ".vercel", ".next", "node_modules", "__pycache__", "_site", ".venv", "venv"}
          text_extensions = {".html", ".htm", ".css", ".js", ".mjs", ".json", ".webmanifest", ".xml"}
          target.mkdir(exist_ok=True)
          for src in base.rglob("*"):
              if not src.is_file() or any(part in ignored for part in src.relative_to(base).parts):
                  continue
              rel = src.relative_to(base)
              out = target / rel
              out.parent.mkdir(parents=True, exist_ok=True)
              if src.suffix.lower() not in text_extensions:
                  shutil.copy2(src, out)
                  continue
              try:
                  raw = src.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  shutil.copy2(src, out)
                  continue
              # GitHub Pages project sites live under /alberth/ whereas Vercel lives at /.
              # This transformation affects only deployment artifacts; original files stay intact.
              # Do not rewrite URL path fragments in JS concatenation (id+'/maxresdefault.jpg').
              raw = re.sub(r'''(?<!\+)(["'])/(?!/|alberth/)(?=[\w#?])''',
                           lambda m: m.group(1) + "/alberth/", raw)
              raw = re.sub(r'''(?i)(url\(\s*)/(?!/|alberth/)''',
                           lambda m: m.group(1) + "/alberth/", raw)
              raw = raw.replace('href="/"', 'href="/alberth/"')
              raw = raw.replace("href='/'", "href='/alberth/'")
              out.write_text(raw, encoding="utf-8")
          (target / ".nojekyll").write_text("", encoding="utf-8")
          (target / "afh-preview-build.json").write_text(
              json.dumps({"sha": os.environ.get("AFH_SHA"), "version": "AFH V31 Rotating 3D Disciplines", "provider": "GitHub Pages"}),
              encoding="utf-8")
          assert (target / "index.html").exists()
          assert (target / "journey" / "index.html").exists()
          assert (target / "learning-index-v25.json").exists()
          assert (target / "afh-3d-sections-v31.js").exists()
          assert (target / "afh-3d-sections-v31.css").exists()
          assert (target / "afh-mobile-fix-v28.css").exists()
          assert (target / "afh-galaxy-3d-v29.js").exists()
          assert (target / "afh-galaxy-fallback-v29.js").exists()
          assert (target / "afh-video-atlas-v21.css").exists()
          assert (target / "afh-audio-dock-v21.js").exists()
          homepage = (target / "index.html").read_text(encoding="utf-8")
          assert 'class="afh3-selected afh31-section"' in homepage
          assert homepage.count('class="afh31-canvas"') == 4
          for scene in ("economics","finance","ai","crypto"):
              assert 'data-scene="'+scene+'"' in homepage, scene
          for path in (
              "/alberth/afh-3d-sections-v31.js",
              "/alberth/afh-3d-sections-v31.css",
              "/alberth/afh-mobile-fix-v28.css",
          ):
              assert path in homepage, path
          assert "href=\"/alberth/library/finance/\"" in homepage
          assert "href=\"/alberth/library/crypto/\"" in homepage
          assert "id=\"afh29-galaxy\"" in homepage
          assert "id=\"journey\"" in homepage
          assert "id=\"youtube-grid\"" in homepage
          assert "id=\"about\"" in homepage
          journey = (target / "journey" / "index.html").read_text(encoding="utf-8")
          assert "1,692" in journey
          print("AFH V31 rotating 3D sections preview prepared:", sum(1 for _ in target.rglob("*") if _.is_file()), "files")
          PY

      - name: Cache original YouTube thumbnails from source video IDs
        run: |
          python3 build-thumbnails.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('_site/video-thumbnails-manifest.json').read_text(encoding='utf-8'))
          assert m['attempted'] >= 24, m
          print('Video thumbnails cached:', m['cached'], '/', m['attempted'])
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
